_format_version: "3.0"
_transform: true

# -------------------------------------------------------------------------
# 🔗 1. SERVICES & ROUTES (라우팅 및 목적지 정의)
# -------------------------------------------------------------------------
services:
  # [서비스 1] 사용자 관리 API (예시)
  - name: user-service
    url: http://jenkins:8080 # 💡 같은 Docker 네트워크(services) 상의 컨테이너 이름 지정 가능
    routes:
      - name: user-public-route
        paths:
          - /api/v1/users
        strip_path: false # true로 설정하면 백엔드로 넘길 때 '/api/v1/users' 경로를 잘라내고 보냅니다.

  # [서비스 2] 결제 및 빌링 API (예시)
  - name: payment-service
    url: http://mattermost:8065 # 테스트를 위해 네트워크 내 다른 서비스 주소를 임시 타겟팅
    routes:
      - name: payment-route
        paths:
          - /api/v1/payments
        strip_path: false

# -------------------------------------------------------------------------
# 🔌 2. PLUGINS (글로벌 또는 서비스별 플러그인 장착)
# -------------------------------------------------------------------------
plugins:
  # 🛡️ [플러그인 A] 글로벌 CORS 설정 (모든 API 라우트에 적용)
  - name: cors
    config:
      origins:
        - "*" # 실전 운영 시에는 특정 프론트엔드 도메인만 지정하는 것이 좋습니다.
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - X-Requested-With
      exposed_headers:
        - X-Total-Count
      credentials: true
      max_age: 3600

  # 🛑 [플러그인 B] 특정 서비스에만 트래픽 제한 (디도스 및 과부하 방지)
  - name: rate-limiting
    service: user-service # 💡 위에서 정의한 user-service 에만 이 규칙이 붙습니다.
    config:
      minute: 100         # 분당 최대 100회 호출 허용
      hour: 5000          # 시간당 최대 5000회 호출 허용
      policy: local       # DB-less 모드이므로 메모리 내 로컬 카운터 사용

  # 🔑 [플러그인 C] 결제 API 라우트에 보안 토큰 검증 장착 (선택 사항)
  - name: jwt
    route: payment-route # 💡 중요도가 높은 결제 라우트에만 JWT 토큰 필수 검증 적용
    config:
      header_names:
        - authorization
      claims_to_verify:
        - exp             # 만료 시간 자동 검증