services:
  nginx:
    image: nginx:1.28-alpine
    container_name: nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      # nginx 설정
      - ./setting/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./setting/conf.d:/etc/nginx/conf.d:ro

      # 정적 파일
      - ./setting/html:/usr/share/nginx/html

      # certbot 인증서
      - /storage/docker-storage/certbot/conf:/etc/letsencrypt
      - /storage/docker-storage/certbot/www:/var/www/certbot

      # 로그
      - /storage/docker-storage/nginx/logs:/var/log/nginx

      # 소켓 연결용
      - /var/run/docker.sock:/var/run/docker.sock:ro

      # timezone
      - /etc/localtime:/etc/localtime:ro

    networks:
      - services

networks:
  services:
    external: true