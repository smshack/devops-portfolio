# 1. HTTP (80번 포트): HTTPS 강제 리다이렉트 및 Certbot 인증
server {
    listen 80;
    server_name mattermost.smartseoapp.com;

    # Certbot SSL 인증서 갱신용 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 모든 HTTP 요청을 HTTPS로 안전하게 전환
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS (443번 포트): Reverse Proxy 및 실시간 웹소켓 최적화
server {
    listen 443 ssl;
    server_name mattermost.smartseoapp.com;

    # 🔑 Let's Encrypt SSL 인증서 경로
    ssl_certificate /etc/letsencrypt/live/mattermost.smartseoapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mattermost.smartseoapp.com/privkey.pem;

    # 🔒 SSL 프로토콜 및 보안 암호화 셋팅 (A+ 등급 규격)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';

    # 📦 파일, 이미지, 영상 업로드 제한 확장 (기본 용량이 작으면 첨부파일 에러 발생)
    client_max_body_size 100M;

    # 🛠️ [경로 1] Mattermost 실시간 대화 웹소켓(WebSocket) 전용 프록시
    location /api/v4/websocket {
        proxy_pass http://mattermost:8065;
        
        # 웹소켓 연결 유지에 필수적인 3대 헤더
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Frame-Options SAMEORIGIN;
        
        # 실시간 세션이 끊기지 않도록 타임아웃 넉넉히 지정
        proxy_connect_timeout 90;
        proxy_send_timeout 90;
        proxy_read_timeout 90;
    }

    # 🌐 [경로 2] 일반 HTTP 웹 페이지 및 API 요청 프록시
    location / {
        proxy_pass http://mattermost:8065;
        
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Frame-Options SAMEORIGIN;
        
        proxy_connect_timeout 90;
        proxy_send_timeout 90;
        proxy_read_timeout 90;
        
        # 실시간 렌더링을 위해 Nginx 단의 버퍼링 비활성화
        proxy_buffering off;
    }
}