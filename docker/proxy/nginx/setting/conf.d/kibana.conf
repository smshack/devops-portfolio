# 1. HTTP (80번 포트): HTTPS 강제 리다이렉트
server {
    listen 80;
    server_name kibana.smartseoapp.com;

    # Certbot SSL 인증서 갱신용 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS (443번 포트): 리버스 프록시 및 대용량/실시간 최적화
server {
    listen 443 ssl;
    server_name kibana.smartseoapp.com;

    # 🔑 Let's Encrypt SSL 인증서 경로
    ssl_certificate /etc/letsencrypt/live/kibana.smartseoapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kibana.smartseoapp.com/privkey.pem;

    # 🔒 고성능 보안 암호화 프로토콜 셋팅
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 📦 [튜닝 1] 대용량 매핑 데이터 및 로그 파일 전송 업로드 제한 해제
    client_max_body_size 100M;

    location / {
        # 외부 네트워크(services) 내 Kibana 컨테이너 및 내부 포트 지정
        proxy_pass http://kibana:5601;
        
        # 기본 프록시 헤더 설정 (Kibana가 원래 요청 구조를 정확히 파악하도록 위임)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # 🛠️ [튜닝 2] 방대한 쿼리/과거 로그 대량 조회 시 타임아웃 방어 (5분으로 확장)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 🏎️ [튜닝 3] 실시간 대시보드 반응성 향상을 위해 프록시 버퍼링 중단
        proxy_buffering off;

        # 대량 응답 버퍼 크기 최적화 (대시보드가 깨지거나 일부만 로딩되는 현상 방지)
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
        proxy_busy_buffers_size 64k;

        # 🔒 [튜닝 4] Nginx 웹 로그인 인증창 적용 (선택 사항)
        # 아래 두 줄의 주석(#)을 풀면 지정한 관리자 외에는 대시보드 접근이 원천 차단됩니다.
        # auth_basic "Kibana Admin Area";
        # auth_basic_user_file /etc/nginx/.htpasswd;
    }
}