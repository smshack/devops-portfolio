# 1. HTTP (80번 포트): HTTPS 강제 리다이렉트
server {
    listen 80;
    server_name jenkins.smartseoapp.com;

    # Certbot SSL 인증서 갱신용 웹루트 설정 (필요 시 활용)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 모든 HTTP 요청을 HTTPS로 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS (443번 포트): Reverse Proxy 실전 세팅
server {
    listen 443 ssl;
    server_name jenkins.smartseoapp.com;

    # 🔑 SSL 인증서 경로 지정
    # (GitLab과 같은 와일드카드 인증서이거나, 별도로 발급받은 Jenkins 인증서 경로를 입력하세요)
    ssl_certificate /etc/letsencrypt/live/gitlab.smartseoapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gitlab.smartseoapp.com/privkey.pem;

    # 🔒 SSL 프로토콜 최적화
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 📦 대용량 파일 업로드 해제 (빌드 산출물, 무거운 플러그인 업로드 대응)
    client_max_body_size 50M;

    # 🔗 Jenkins 내부 컨테이너 통신 설정
    location / {
        # 같은 Docker 외부 네트워크(services)에 묶여있으므로 컨테이너명(jenkins)과 내부 포트(8080)로 통신합니다.
        proxy_pass http://jenkins:8080;

        # 💡 Jenkins 리버스 프록시 필수 헤더 규격
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # ★ 중요: Jenkins 관리자 페이지에서 "리버스 프록시가 잘못되었습니다" 라는 경고 배너를 지워주는 핵심 헤더입니다.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        # 🛠️ Jenkins 웹소켓(WebSocket) 및 실시간 빌드 로그 스트리밍을 위한 프로토콜 스위칭 지원
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 기본 버퍼 사이즈 및 타임아웃 확장 (대용량 플러그인 설치 시 다운 방지)
        proxy_connect_timeout 90;
        proxy_send_timeout 90;
        proxy_read_timeout 90;
        proxy_buffering off; # 실시간 콘솔 로그 출력을 위해 버퍼링을 끕니다.
        
        # HTTP 응답 헤더 내의 리다이렉트 주소를 HTTPS 규격에 맞게 자동 교정
        proxy_redirect http:// https://;
    }
}