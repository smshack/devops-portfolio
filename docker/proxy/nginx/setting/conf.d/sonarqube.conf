server {
    listen 80;
    server_name sonarqube.smartseoapp.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name sonarqube.smartseoapp.com;

    ssl_certificate /etc/letsencrypt/live/sonarqube.smartseoapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sonarqube.smartseoapp.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';

    # 소스코드 정적 분석 리포트 업로드를 위해 업로드 제한 확장
    client_max_body_size 100M;

    location / {
        # 외부 네트워크(services) 상의 sonarqube 컨테이너의 내부 포트(9000)로 패스
        proxy_pass http://sonarqube:9000;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        # 대량 분석 데이터 전송 중 끊김 방지용 타임아웃 확장
        proxy_connect_timeout 150;
        proxy_send_timeout 150;
        proxy_read_timeout 150;
        
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
        proxy_busy_buffers_size 64k;
    }
}