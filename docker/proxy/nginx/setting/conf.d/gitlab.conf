# 1. HTTP (80번 포트) 설정: Certbot 인증 유지 및 HTTPS 강제 리다이렉트
server {
    listen 80;
    server_name gitlab.smartseoapp.com;

    # Certbot 웹루트 인증용 경로 (인증서 갱신 시 계속 필요하므로 유지)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 그 외 모든 일반 HTTP 요청은 HTTPS(443)로 안전하게 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS (443번 포트) 설정: 실전 서비스 및 Reverse Proxy
server {
    listen 443 ssl;
    server_name gitlab.smartseoapp.com;

    # 🔑 Let's Encrypt SSL 인증서 경로 지정
    ssl_certificate /etc/letsencrypt/live/gitlab.smartseoapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gitlab.smartseoapp.com/privkey.pem;

    # 🔒 SSL 프로토콜 및 암호화 최적화 (보안 실무 규격)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    
    # SSL 세션 캐싱 (성능 향상)
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 📦 대용량 파일 업로드 허용 (GitLab 백업, 리포지토리 푸시, 첨부파일 대응)
    # 💡 이 설정이 없으면 큰 파일(소스코드, 이미지 등)을 푸시할 때 413 Entity Too Large 에러가 발생합니다.
    client_max_body_size 250M;

    # 🔗 GitLab 컨테이너로 요청 프록시 패스
    location / {
        # Docker Compose 서비스명 또는 IP 주소 입력
        # 예: GitLab 컨테이너의 서비스 이름이 'gitlab'이고 내부 포트가 80인 경우
        proxy_pass http://gitlab:80; 

        # 픅록시 헤더 설정 (GitLab이 원래 요청 정보(IP, 프로토콜)를 정확히 인지하도록 전달)
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # ★ 중요: GitLab 내부에서 HTTPS 프로토콜로 통신 중임을 인지하게 만듭니다. (무한 리다이렉트 방지)
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;

        # 타임아웃 제한 확장 (용량이 큰 저장소 복제/푸시 시 연결 끊김 방지)
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_redirect off;
    }
}