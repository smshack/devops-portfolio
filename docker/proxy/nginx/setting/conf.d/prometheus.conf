# HTTP (80번 포트): HTTPS 강제 리다이렉트
server {
    listen 80;
    server_name prometheus.smartseoapp.com;

    # Certbot SSL 인증서 갱신용 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (443번 포트): Reverse Proxy 실전 세팅
server {
    listen 443 ssl;
    server_name prometheus.smartseoapp.com;

    # 🔑 Let's Encrypt SSL 인증서 경로 (서버 환경에 맞게 확인)
    ssl_certificate /etc/letsencrypt/live/prometheus.smartseoapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prometheus.smartseoapp.com/privkey.pem;

    # 🔒 SSL 프로토콜 최적화
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';

    location / {
        # 외부 네트워크(services) 상의 prometheus 컨테이너명과 내부 포트 바인딩
        proxy_pass http://prometheus:9090;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # 프록시 타임아웃 기본 최적화
        proxy_read_timeout 180;
        proxy_connect_timeout 180;
    }
}