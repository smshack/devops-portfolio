# HTTP (80번 포트): HTTPS 강제 리다이렉트
server {
    listen 80;
    server_name grafana.smartseoapp.com;

    # Certbot SSL 인증서 갱신용 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (443번 포트): Reverse Proxy 및 웹소켓 세팅
server {
    listen 443 ssl;
    server_name grafana.smartseoapp.com;

    # 🔑 Let's Encrypt SSL 인증서 경로
    ssl_certificate /etc/letsencrypt/live/grafana.smartseoapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.smartseoapp.com/privkey.pem;

    # 🔒 SSL 프로토콜 최적화
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';

    location / {
        # 외부 네트워크(services) 상의 grafana 컨테이너명과 내부 포트 바인딩
        proxy_pass http://grafana:3000;
        
        # 💡 중요: Grafana 내부 호스트 도메인 체크 우회를 위해 $http_host 대입
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # 🛠️ Grafana 라이브 스트리밍 대시보드용 웹소켓(WebSocket) 설정
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 버퍼링 비활성화로 실시간성 확보
        proxy_buffering off;
    }
}